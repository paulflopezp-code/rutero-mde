name: rutero_mde
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.15+37

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  image_picker: ^1.1.2
  firebase_storage: ^12.3.2
  path_provider: ^2.1.2
  firebase_app_check: ^0.3.1+4
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  app_links: ^6.3.2
  crypto: ^3.0.3
  http: ^1.2.1
  gal: ^1.3.0
  material_symbols_icons: ^4.2799.0  # Fase 2 Design System — BottomNav, chips, acciones

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0D1F0D"
  

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/logo_splash.png
    - assets/images/splash_bg.png
    - assets/images/onboarding_explora.png
    - assets/images/onboarding_valida.png
    - assets/images/onboarding_gana.png
    - assets/images/rutas/
    - assets/images/insignias/
    - assets/images/avatar/
    - assets/images/logo_rutero_badge.png
    - assets/audio/
    - assets/images/servicios/
    - assets/images/colaboradores/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/Playfair_9pt-Black.ttf
          weight: 900
        - asset: assets/fonts/Playfair_9pt-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
